name: PassThePhone CI

on:
  push:
    branches: [main, build/v1-finish]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Multiplayer API smoke test
        env:
          SUPABASE_URL: https://nowlwprtcnieihelqjoa.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_487zTc09VarME-Fgf6EYig__47s_JTp
        run: node scripts/api-smoke.mjs
