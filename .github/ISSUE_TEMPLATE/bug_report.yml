name: Bug report
description: Report a reproducible PassThePhone problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include API keys, room tokens, or private credentials.**
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a room
        2. Join from...
        3. Tap...
        4. Observe...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Room creation / join
        - Lobby
        - Gameplay / turn passing
        - Heat / categories
        - Chat / reactions
        - Voice / video
        - Results / receipts
        - PWA / install
        - Deployment / other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Device / browser
      placeholder: "iPhone 15 / Safari, Windows / Chrome, etc."
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Redact room tokens, API keys, secrets, and personal information first.
